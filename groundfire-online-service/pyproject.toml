[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "groundfire-online-service"
version = "0.2.0"
description = "Unified online, compatibility and hosted-match service for Groundfire."
requires-python = ">=3.10,<3.15"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[project.scripts]
gf-service = "gf_service.cli:main"
groundfire-online-service = "gf_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gf_service = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

