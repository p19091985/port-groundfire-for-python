services:
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./build/web_export:/srv/web_export
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - directory
      - gateway

  directory:
    build: .
    command:
      [
        "python",
        "-m",
        "groundfire_net.directory_service",
        "--host",
        "0.0.0.0",
        "--port",
        "27880",
        "--session-secret",
        "${SESSION_SECRET:-changeme_for_prod}",
        "--gateway-endpoint",
        "${GROUNDFIRE_PUBLIC_GATEWAY_ENDPOINT:-wss://play.groundfire.net/gateway}",
        "--session-token-url",
        "${GROUNDFIRE_PUBLIC_SESSION_TOKEN_URL:-https://play.groundfire.net/directory/session-token.json}",
      ]
    environment:
      - PYTHONUNBUFFERED=1
      - GROUNDFIRE_DIRECTORY_REQUIRE_GITHUB_OAUTH=1
    restart: always

  server:
    build: .
    command:
      ["python", "-m", "src.groundfire.server", "--host", "0.0.0.0", "--port", "27015", "--no-discovery"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  gateway:
    build: .
    command:
      [
        "python",
        "-m",
        "groundfire_net.websocket_gateway",
        "--host",
        "0.0.0.0",
        "--port",
        "27080",
        "--session-secret",
        "${SESSION_SECRET:-changeme_for_prod}",
        "--max-players",
        "100",
        "--udp-host",
        "server",
        "--udp-port",
        "27015",
      ]
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - server
    restart: always

volumes:
  caddy_data:
  caddy_config:
