[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundfire"
version = "0.25.0"
description = "Groundfire Python edition (standalone)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pygame==2.6.1; python_version < '3.14'",
    "pygame-ce>=2.5.8,<3; python_version >= '3.14'",
    "pygame_gui>=0.6.14,<0.7",
    "pygame-menu>=4.4,<5; python_version < '3.14'",
]

[project.scripts]
groundfire = "groundfire.client:main"
groundfire-server = "groundfire.server:main"
groundfire-master = "groundfire.master:main"
groundfire-web-gateway = "groundfire_net.websocket_gateway:main"
groundfire-directory = "groundfire_net.directory_service:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["groundfire*", "groundfire_net*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
